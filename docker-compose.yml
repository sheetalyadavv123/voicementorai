services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: voice-mentor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: voicementor
      POSTGRES_PASSWORD: voicementor
      POSTGRES_DB: voicementor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicementor"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
